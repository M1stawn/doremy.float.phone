name: Auto Fix Local Storage & Full Backup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auto-fix-storage.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inject Native Disk Vault & Fix Full Backup
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          // ── 1. 升级 MainActivity.kt：加入手机 filesDir 固化磁盘读写桥 ──
          const ktPath = 'android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt';
          if (fs.existsSync(ktPath)) {
            let kt = fs.readFileSync(ktPath, 'utf8');
            if (!kt.includes('fun saveLocalDiskData(')) {
              const anchor = 'fun downloadUrl(url: String, fileName: String): Boolean {';
              const idx = kt.indexOf(anchor);
              if (idx !== -1) {
                const insertPos = kt.indexOf('\n', kt.indexOf('}.getOrDefault(false)', idx)) + 1;
                const closeBracePos = kt.indexOf('}', insertPos) + 1;
                const vaultMethods = `

        // ── 本地磁盘永久存储桥（写入手机 filesDir，永不随 WebView 缓存丢失）──
        private fun localVaultDir(): File = File(filesDir, "float_local_vault").apply {
            if (!exists()) mkdirs()
        }

        @JavascriptInterface
        fun saveLocalDiskData(key: String, content: String): Boolean {
            if (!isTrustedShellPage()) return false
            return runCatching {
                val safeKey = key.replace(Regex("[^a-zA-Z0-9._-]"), "_").take(120)
                if (safeKey.isBlank()) return false
                val target = File(localVaultDir(), "$safeKey.json")
                val temp = File(localVaultDir(), "$safeKey.tmp")
                temp.writeText(content, Charsets.UTF_8)
                if (!temp.renameTo(target)) {
                    target.writeText(content, Charsets.UTF_8)
                    temp.delete()
                }
                true
            }.getOrDefault(false)
        }

        @JavascriptInterface
        fun loadLocalDiskData(key: String): String {
            if (!isTrustedShellPage()) return ""
            return runCatching {
                val safeKey = key.replace(Regex("[^a-zA-Z0-9._-]"), "_").take(120)
                val target = File(localVaultDir(), "$safeKey.json")
                if (target.isFile) target.readText(Charsets.UTF_8) else ""
            }.getOrDefault("")
        }

        @JavascriptInterface
        fun removeLocalDiskData(key: String): Boolean {
            if (!isTrustedShellPage()) return false
            return runCatching {
                val safeKey = key.replace(Regex("[^a-zA-Z0-9._-]"), "_").take(120)
                val target = File(localVaultDir(), "$safeKey.json")
                if (target.exists()) target.delete() else true
            }.getOrDefault(false)
        }
`;
                kt = kt.slice(0, closeBracePos) + vaultMethods + kt.slice(closeBracePos);
                fs.writeFileSync(ktPath, kt, 'utf8');
                console.log('[OK] Patched MainActivity.kt with Native Disk Vault');
              }
            }
          }

          // ── 2. 在 app/layout.tsx 挂载无感本地硬盘双写 + 启动防丢恢复 + 全量备份兜底 ──
          const layoutPath = 'app/layout.tsx';
          if (fs.existsSync(layoutPath)) {
            let layout = fs.readFileSync(layoutPath, 'utf8');
            const marker = 'id="float-native-vault-sync"';
            if (!layout.includes(marker)) {
              const syncScript = `
        <script id="float-native-vault-sync" dangerouslySetInnerHTML={{ __html: \`
(function() {
  if (typeof window === 'undefined') return;
  var SNAPSHOT_KEY = '__float_full_vault_v1__';
  var restored = false;

  // 清除可能导致增量备份只导出零点后/上次备份后数据的游标键
  function clearIncrementalCursors() {
    try {
      var cursorPatterns = /last[_-]?backup|incremental[_-]?cursor|backup[_-]?since|export[_-]?cursor|daily[_-]?cutoff/i;
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && cursorPatterns.test(k)) {
          localStorage.removeItem(k);
        }
      }
    } catch (_) {}
  }

  // 将当前全部 localStorage 原子打包落盘到安卓原生 filesDir
  var saveTimer = null;
  function flushToNativeDisk() {
    try {
      var shell = window.AndroidShell;
      if (!shell || typeof shell.saveLocalDiskData !== 'function') return;
      var dump = {};
      var count = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k) continue;
        dump[k] = localStorage.getItem(k);
        count++;
      }
      // 防止空状态覆盖有效本地备份：只有当存在实际业务数据时才更新主快照
      if (count > 2) {
        shell.saveLocalDiskData(SNAPSHOT_KEY, JSON.stringify(dump));
      }
    } catch (_) {}
  }

  function scheduleFlush() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushToNativeDisk, 800);
  }

  // 启动时若发现网页缓存被清空或丢失，立即从手机本地硬盘恢复
  function restoreFromNativeDiskIfNeeded() {
    if (restored) return;
    try {
      var shell = window.AndroidShell;
      if (!shell || typeof shell.loadLocalDiskData !== 'function') return;
      restored = true;
      var raw = shell.loadLocalDiskData(SNAPSHOT_KEY);
      if (!raw) {
        flushToNativeDisk();
        return;
      }
      var saved = JSON.parse(raw);
      var savedKeys = Object.keys(saved || {});
      if (savedKeys.length === 0) return;

      var restoredCount = 0;
      for (var i = 0; i < savedKeys.length; i++) {
        var k = savedKeys[i];
        var currentVal = localStorage.getItem(k);
        // 如果网页里该键丢失、或被重置为空数组/空对象，而本地磁盘里有完整长数据，则自动恢复
        if (currentVal === null || (currentVal.length < 5 && saved[k] && saved[k].length >= 5)) {
          localStorage.setItem(k, saved[k]);
          restoredCount++;
        }
      }
      if (restoredCount > 0 && !sessionStorage.getItem('__vault_reloaded__')) {
        sessionStorage.setItem('__vault_reloaded__', '1');
        window.location.reload();
      }
    } catch (_) {}
  }

  // 拦截 localStorage 写入，每次变动自动同步到手机硬盘
  var origSetItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, val) {
    origSetItem.call(this, key, val);
    if (this === window.localStorage) {
      if (key && typeof val === 'string' && window.AndroidShell && typeof window.AndroidShell.saveLocalDiskData === 'function') {
        try { window.AndroidShell.saveLocalDiskData('kv_' + key, val); } catch (_) {}
      }
      scheduleFlush();
    }
  };

  window.addEventListener('floatshell-bridge-ready', function() {
    clearIncrementalCursors();
    restoreFromNativeDiskIfNeeded();
  });
  window.addEventListener('load', function() {
    clearIncrementalCursors();
    restoreFromNativeDiskIfNeeded();
    setTimeout(flushToNativeDisk, 3000);
  });
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') flushToNativeDisk();
  });
})();
\` }} />`;
              layout = layout.replace('</body>', syncScript + '\n      </body>');
              fs.writeFileSync(layoutPath, layout, 'utf8');
              console.log('[OK] Patched app/layout.tsx with auto native disk sync & full backup guard');
            }
          }
          EOF

      - name: Verify Android Bridge Security Contract
        run: node scripts/check-android-permissions.mjs

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes needed"
          else
            git commit -m "feat: persist data to Android local filesDir vault and prevent incremental backup truncation"
            git push
          fi
